name: Deterministic Checks

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  # Installed-project Beryl gate. This repository is an installed target, not a Beryl
  # source checkout, so it runs check.sh WITHOUT --development (which would demand the
  # source-checkout marker that installed targets deliberately do not carry).
  beryl-checks:
    name: Beryl deterministic checks (installed target)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # Pinned to a full commit SHA so a moved tag cannot silently change the
        # executed action. Dependabot keeps the digest current.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run installed-target deterministic checks
        run: ./.beryl/scripts/check.sh

  python-tests:
    name: Python tests (uv, CPU-only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        # Pinned to the immutable v8.0.0 release commit.
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0

      - name: Create the CPU-only environment
        # No `runtime` extra: torch/triton are never installed in CI. The suite runs
        # on a machine with no GPU, exactly like the documented verification path.
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -e '.[dev]'

      - name: Lint
        run: .venv/bin/ruff check .

      - name: Run the full test suite
        run: .venv/bin/python -m pytest -q -p no:cacheprovider

  research-integrity:
    name: Archive verify + reproducible paper sources
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0

      - name: Create the CPU-only environment
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -e '.[dev]'

      - name: Verify the append-only archive
        run: |
          .venv/bin/python -c '
          from pathlib import Path
          from ratchet.experiments import FileExperimentArchive
          archive = FileExperimentArchive(Path("research/archive"))
          archive.verify()
          projection = archive.projection()
          print(f"verified archive: {projection.event_count} event(s), {projection.projection_id}")
          '

      - name: Regenerate paper sources and assert they are committed
        # Tectonic (PDF binary compile) is intentionally not run in CI: the PDF is a
        # derived artefact. What CI enforces is that the *generated LaTeX/JSON sources*
        # are reproducible from the verified archive and match what is committed. A
        # drift here means someone hand-edited a generated file.
        run: |
          .venv/bin/python -c '
          from pathlib import Path
          from ratchet.reporting import generate_sources
          generate_sources(Path.cwd())
          '
          if ! git diff --quiet -- research/paper/generated; then
            echo "ERROR: regenerated paper sources differ from committed sources:" >&2
            git --no-pager diff -- research/paper/generated >&2
            exit 1
          fi
          echo "paper sources: reproducible and committed"
