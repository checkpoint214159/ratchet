# Not an installable package -- this file exists to (a) put the repo root on
# sys.path for bare `pytest` (python3 -m pytest gets it from cwd; bare pytest does
# not), and (b) record the pinned toolchain, per CLAUDE.md: a measurement is only
# meaningful against a toolchain, and these versions are stamped into every ledger
# row by the oracle.
[project]
name = "ratchet"
version = "0.1.0"
description = "Agentic GPU kernel optimization harness (TikTok TechJam 2026)"
requires-python = ">=3.10"
# Confirmed working toolchain on the reference rig (RTX 4070 Ti SUPER, WSL2,
# CUDA 12.8 driver stack). Install torch/triton per your CUDA setup, not blindly
# from here.
dependencies = [
    "torch==2.8.0",
    "triton==3.4.0",
    "pytest>=8",
    "pytest-testmon>=2",
]

[project.optional-dependencies]
dev = [
    "ruff==0.16.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "gpu: requires the legacy CUDA oracle and a CUDA-capable PyTorch runtime",
]

[tool.ruff]
target-version = "py310"
include = [
    "ratchet/*.py",
    "ratchet/**/*.py",
    "tests/*.py",
    "tests/**/*.py",
]
extend-exclude = [
    ".beryl",
    "ratchet/oracle",
    "tests/golden",
    "benchmarks/reference/torch_transformer_benchmark.py",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
